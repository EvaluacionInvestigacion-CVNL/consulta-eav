# REFERENCIA, NO CONFIG ACTIVA: el servicio de Render se configura en el
# dashboard y Render no aplica este archivo. Mantenerlo a mano igual al
# dashboard. Ver docs/desarrollo.md.
services:
  - type: web
    name: encuesta-nl
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python db/build_db.py && cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: /opt/render/project/src/data/encuesta_multianual.duckdb
      - key: STATIC_DIR
        value: /opt/render/project/src/frontend/dist
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NODE_VERSION
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - key: ENVIRONMENT
        value: "production"
      - key: SENTRY_DSN
        sync: false
      - key: FEATURES
        value: ""
      - key: CHAT_RATE_PER_MIN
        value: "5"
      - key: CHAT_DAILY_GLOBAL
        value: "15"
      - key: CHAT_MAX_MESSAGE_CHARS
        value: "1000"
      - key: CHAT_MAX_HISTORY_MSGS
        value: "12"
